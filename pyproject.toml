[project]
name = "abeg-ops-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=4.1.8",
    "httpx>=0.28.1",
    "langchain>=1.5.0",
    "langchain-core>=1.8.0",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langchain-redis>=0.3.0",
    "langgraph>=1.2.21",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.3.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["config"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]          # long lines: the formatter handles these

[tool.ruff.lint.per-file-ignores]
"mcp_tools/mcp_tool.py" = ["E402"]   # load_dotenv() must run before the db import

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true
explicit_package_bases = true
namespace_packages = true
exclude = ["^config/"]